[project]
name = "helpline"
version = "0.1.0"
description = "B2B helpdesk platform — internal monorepo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyright>=1.1.400", "mcp>=1.2"]

[tool.pytest.ini_options]
pythonpath = ["packages", "services"]
testpaths = ["tests", "services"]

[tool.pyright]
extraPaths = ["packages", "services"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingImports = true

[tool.uv]
package = false
