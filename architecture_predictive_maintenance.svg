<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="-apple-system, Segoe UI, Inter, sans-serif">
  <!-- Background -->
  <rect width="1400" height="820" fill="#f8fafc"/>

  <!-- Title band -->
  <rect width="1400" height="90" fill="#1a2754"/>
  <rect x="0" y="0" width="8" height="90" fill="#14a085"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#ffffff">Predictive Maintenance — Reference Architecture</text>
  <text x="40" y="68" font-size="14" fill="#cbd5e1">Recommended Hyundai start: Ulsan stamping presses + Asan welding cells · 3–5 high-criticality assets</text>
  <text x="1360" y="42" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="2">PEOPLETECH · AI MANUFACTURING</text>
  <text x="1360" y="68" font-size="11" fill="#94a3b8" text-anchor="end">Use Case 06 · Pilot 2</text>

  <!-- Layer headers -->
  <g font-size="11" font-weight="700" letter-spacing="2" fill="#475569">
    <text x="160" y="135" text-anchor="middle">EDGE / CAPTURE</text>
    <text x="490" y="135" text-anchor="middle">COMPUTE / AI MODELS</text>
    <text x="820" y="135" text-anchor="middle">INTEGRATION</text>
    <text x="1180" y="135" text-anchor="middle">UX / DECISION</text>
  </g>

  <!-- Layer 1: Edge / Capture (teal) -->
  <rect x="40" y="160" width="240" height="500" fill="#ffffff" stroke="#14a085" stroke-width="2" rx="6"/>
  <rect x="40" y="160" width="240" height="36" fill="#14a085" rx="6"/>
  <rect x="40" y="190" width="240" height="6" fill="#14a085"/>
  <text x="160" y="184" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ASSET-SIDE</text>

  <g font-size="13" fill="#1e293b">
    <rect x="60" y="220" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="160" y="244" font-weight="700" text-anchor="middle">Vibration Accel.</text>
    <text x="160" y="264" text-anchor="middle">Triaxial IIoT sensors</text>
    <text x="160" y="280" font-size="11" fill="#64748b" text-anchor="middle">2–4 per press / cell</text>

    <rect x="60" y="305" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="160" y="329" font-weight="700" text-anchor="middle">Acoustic Emission</text>
    <text x="160" y="349" text-anchor="middle">Ultrasonic mic array</text>
    <text x="160" y="365" font-size="11" fill="#64748b" text-anchor="middle">Crack + leak signatures</text>

    <rect x="60" y="390" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="160" y="414" font-weight="700" text-anchor="middle">Thermal Cameras</text>
    <text x="160" y="434" text-anchor="middle">Bearing / motor hotspots</text>
    <text x="160" y="450" font-size="11" fill="#64748b" text-anchor="middle">FLIR · Optris</text>

    <rect x="60" y="475" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="160" y="499" font-weight="700" text-anchor="middle">IoT Edge Gateway</text>
    <text x="160" y="519" text-anchor="middle">AWS IoT Greengrass</text>
    <text x="160" y="535" font-size="11" fill="#64748b" text-anchor="middle">or Azure IoT Edge</text>

    <rect x="60" y="560" width="200" height="80" fill="#1a2754" rx="4"/>
    <text x="160" y="588" font-weight="700" fill="#ffffff" text-anchor="middle">Ulsan + Asan</text>
    <text x="160" y="608" fill="#cbd5e1" font-size="11" text-anchor="middle">Stamping presses</text>
    <text x="160" y="624" fill="#cbd5e1" font-size="11" text-anchor="middle">Welding cells</text>
  </g>

  <!-- Layer 2: Compute / AI Models (navy) -->
  <rect x="370" y="160" width="240" height="500" fill="#ffffff" stroke="#1a2754" stroke-width="2" rx="6"/>
  <rect x="370" y="160" width="240" height="36" fill="#1a2754" rx="6"/>
  <rect x="370" y="190" width="240" height="6" fill="#1a2754"/>
  <text x="490" y="184" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">CLOUD ML</text>

  <g font-size="13" fill="#1e293b">
    <rect x="390" y="220" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="490" y="244" font-weight="700" text-anchor="middle">Autoencoder</text>
    <text x="490" y="264" text-anchor="middle">Anomaly detection</text>
    <text x="490" y="280" font-size="11" fill="#64748b" text-anchor="middle">Unsupervised baseline</text>

    <rect x="390" y="305" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="490" y="329" font-weight="700" text-anchor="middle">Survival Models</text>
    <text x="490" y="349" text-anchor="middle">Weibull · DeepSurv</text>
    <text x="490" y="365" font-size="11" fill="#64748b" text-anchor="middle">Remaining-useful-life</text>

    <rect x="390" y="390" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="490" y="414" font-weight="700" text-anchor="middle">Acoustic CNN</text>
    <text x="490" y="434" text-anchor="middle">Sound classifier</text>
    <text x="490" y="450" font-size="11" fill="#64748b" text-anchor="middle">Failure-mode tagging</text>

    <rect x="390" y="475" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="490" y="499" font-weight="700" text-anchor="middle">MLflow + SageMaker</text>
    <text x="490" y="519" text-anchor="middle">or Azure ML</text>
    <text x="490" y="535" font-size="11" fill="#64748b" text-anchor="middle">Training · registry · drift</text>

    <rect x="390" y="560" width="200" height="80" fill="#0d8a72" rx="4"/>
    <text x="490" y="588" font-weight="700" fill="#ffffff" text-anchor="middle">Configurable Lead Time</text>
    <text x="490" y="608" fill="#d1fae5" font-size="11" text-anchor="middle">Hours → days warning</text>
    <text x="490" y="624" fill="#d1fae5" font-size="11" text-anchor="middle">Tuned per asset criticality</text>
  </g>

  <!-- Layer 3: Integration (orange) -->
  <rect x="700" y="160" width="240" height="500" fill="#ffffff" stroke="#d97706" stroke-width="2" rx="6"/>
  <rect x="700" y="160" width="240" height="36" fill="#d97706" rx="6"/>
  <rect x="700" y="190" width="240" height="6" fill="#d97706"/>
  <text x="820" y="184" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PLANT SYSTEMS</text>

  <g font-size="13" fill="#1e293b">
    <rect x="720" y="220" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="820" y="244" font-weight="700" text-anchor="middle">SAP PM</text>
    <text x="820" y="264" text-anchor="middle">Work-order auto-gen</text>
    <text x="820" y="280" font-size="11" fill="#64748b" text-anchor="middle">Pre-built connector</text>

    <rect x="720" y="305" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="820" y="329" font-weight="700" text-anchor="middle">CMMS (Maximo)</text>
    <text x="820" y="349" text-anchor="middle">Maintenance backlog</text>
    <text x="820" y="365" font-size="11" fill="#64748b" text-anchor="middle">Risk-prioritized queue</text>

    <rect x="720" y="390" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="820" y="414" font-weight="700" text-anchor="middle">Asset Historian</text>
    <text x="820" y="434" text-anchor="middle">AVEVA PI · Aspen IP21</text>
    <text x="820" y="450" font-size="11" fill="#64748b" text-anchor="middle">Multi-year time-series</text>

    <rect x="720" y="475" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="820" y="499" font-weight="700" text-anchor="middle">Parts Inventory API</text>
    <text x="820" y="519" text-anchor="middle">Spare-part check</text>
    <text x="820" y="535" font-size="11" fill="#64748b" text-anchor="middle">Pre-order on risk spike</text>

    <rect x="720" y="560" width="200" height="80" fill="#b45309" rx="4"/>
    <text x="820" y="588" font-weight="700" fill="#ffffff" text-anchor="middle">Existing Hyundai Stack</text>
    <text x="820" y="608" fill="#fef3c7" font-size="11" text-anchor="middle">SAP / CMMS in place</text>
    <text x="820" y="624" fill="#fef3c7" font-size="11" text-anchor="middle">No rip-and-replace</text>
  </g>

  <!-- Layer 4: UX / Decision (purple) -->
  <rect x="1060" y="160" width="240" height="500" fill="#ffffff" stroke="#7c3aed" stroke-width="2" rx="6"/>
  <rect x="1060" y="160" width="240" height="36" fill="#7c3aed" rx="6"/>
  <rect x="1060" y="190" width="240" height="6" fill="#7c3aed"/>
  <text x="1180" y="184" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PEOPLE</text>

  <g font-size="13" fill="#1e293b">
    <rect x="1080" y="220" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="1180" y="244" font-weight="700" text-anchor="middle">Asset Health Dash</text>
    <text x="1180" y="264" text-anchor="middle">Live risk score per asset</text>
    <text x="1180" y="280" font-size="11" fill="#64748b" text-anchor="middle">Plant manager view</text>

    <rect x="1080" y="305" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="1180" y="329" font-weight="700" text-anchor="middle">Mobile Tech App</text>
    <text x="1180" y="349" text-anchor="middle">Field-side intervention</text>
    <text x="1180" y="365" font-size="11" fill="#64748b" text-anchor="middle">iOS / Android · offline-capable</text>

    <rect x="1080" y="390" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="1180" y="414" font-weight="700" text-anchor="middle">Failure-Cause Portal</text>
    <text x="1180" y="434" text-anchor="middle">Engineering analytics</text>
    <text x="1180" y="450" font-size="11" fill="#64748b" text-anchor="middle">Chronic-issue drill-down</text>

    <rect x="1080" y="475" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="1180" y="499" font-weight="700" text-anchor="middle">Auto-Escalation</text>
    <text x="1180" y="519" text-anchor="middle">Risk-tier paging</text>
    <text x="1180" y="535" font-size="11" fill="#64748b" text-anchor="middle">SMS / Teams · 24×7</text>

    <rect x="1080" y="560" width="200" height="80" fill="#6d28d9" rx="4"/>
    <text x="1180" y="588" font-weight="700" fill="#ffffff" text-anchor="middle">12-Week Pilot KPIs</text>
    <text x="1180" y="608" fill="#ede9fe" font-size="11" text-anchor="middle">≥25% ↓ unplanned downtime</text>
    <text x="1180" y="624" fill="#ede9fe" font-size="11" text-anchor="middle">≥1 failure caught in lead time</text>
  </g>

  <!-- Flow arrows between layers -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="285" y1="400" x2="365" y2="400"/>
    <line x1="615" y1="400" x2="695" y2="400"/>
    <line x1="945" y1="400" x2="1055" y2="400"/>
  </g>

  <!-- Feedback loop: outcome data → model retraining -->
  <g stroke="#0d8a72" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <path d="M 1180,700 Q 700,760 490,700" marker-end="url(#arrow-teal)"/>
  </g>
  <text x="800" y="755" font-size="11" fill="#0d8a72" font-style="italic" text-anchor="middle">Outcome data (true positives, false alerts, time-to-failure) → continuous model improvement</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d8a72"/>
    </marker>
  </defs>

  <!-- Footer -->
  <rect x="0" y="780" width="1400" height="40" fill="#0f1729"/>
  <text x="40" y="805" font-size="11" fill="#cbd5e1" font-weight="600">PeopleTech · AI Manufacturing Practice</text>
  <text x="1360" y="805" font-size="11" fill="#94a3b8" text-anchor="end" letter-spacing="1">PILOT 2 ARCHITECTURE · CONFIDENTIAL</text>
</svg>
