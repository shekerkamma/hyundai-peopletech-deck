<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="-apple-system, Segoe UI, Inter, sans-serif">
  <!-- Background -->
  <rect width="1400" height="820" fill="#f8fafc"/>

  <!-- Title band -->
  <rect width="1400" height="90" fill="#1a2754"/>
  <rect x="0" y="0" width="8" height="90" fill="#14a085"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#ffffff">AI-based Visual Inspection — Reference Architecture</text>
  <text x="40" y="68" font-size="14" fill="#cbd5e1">Recommended Hyundai start: Paint shop · IONIQ 5 / IONIQ 9 line · Metaplant America (HMGMA)</text>
  <text x="1360" y="42" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="2">PEOPLETECH · AI MANUFACTURING</text>
  <text x="1360" y="68" font-size="11" fill="#94a3b8" text-anchor="end">Use Case 01 · Pilot 1</text>

  <!-- Layer headers -->
  <g font-size="11" font-weight="700" letter-spacing="2" fill="#475569">
    <text x="160" y="135" text-anchor="middle">EDGE / CAPTURE</text>
    <text x="490" y="135" text-anchor="middle">COMPUTE / AI MODELS</text>
    <text x="820" y="135" text-anchor="middle">INTEGRATION</text>
    <text x="1180" y="135" text-anchor="middle">UX / DECISION</text>
  </g>

  <!-- Layer 1: Edge / Capture (teal) -->
  <rect x="40" y="160" width="240" height="500" fill="#ffffff" stroke="#14a085" stroke-width="2" rx="6"/>
  <rect x="40" y="160" width="240" height="36" fill="#14a085" rx="6"/>
  <rect x="40" y="190" width="240" height="6" fill="#14a085"/>
  <text x="160" y="184" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">LINE-SIDE</text>

  <g font-size="13" fill="#1e293b">
    <rect x="60" y="220" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="160" y="244" font-weight="700" text-anchor="middle">Cognex / Basler</text>
    <text x="160" y="264" text-anchor="middle">High-res cameras</text>
    <text x="160" y="280" font-size="11" fill="#64748b" text-anchor="middle">8–12 per station, multi-angle</text>

    <rect x="60" y="305" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="160" y="329" font-weight="700" text-anchor="middle">LED Light Tunnel</text>
    <text x="160" y="349" text-anchor="middle">Controlled illumination</text>
    <text x="160" y="365" font-size="11" fill="#64748b" text-anchor="middle">Shadow-free, repeatable</text>

    <rect x="60" y="390" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="160" y="414" font-weight="700" text-anchor="middle">NVIDIA Jetson Orin</text>
    <text x="160" y="434" text-anchor="middle">Edge inference</text>
    <text x="160" y="450" font-size="11" fill="#64748b" text-anchor="middle">&lt;200 ms latency</text>

    <rect x="60" y="475" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="160" y="499" font-weight="700" text-anchor="middle">Andon Light</text>
    <text x="160" y="519" text-anchor="middle">Operator signaling</text>
    <text x="160" y="535" font-size="11" fill="#64748b" text-anchor="middle">Local pass/fail cue</text>

    <rect x="60" y="560" width="200" height="80" fill="#1a2754" rx="4"/>
    <text x="160" y="588" font-weight="700" fill="#ffffff" text-anchor="middle">HMGMA · Paint Shop</text>
    <text x="160" y="608" fill="#cbd5e1" font-size="11" text-anchor="middle">IONIQ 5 / IONIQ 9 line</text>
    <text x="160" y="624" fill="#cbd5e1" font-size="11" text-anchor="middle">Bryan County, Georgia</text>
  </g>

  <!-- Layer 2: Compute / AI Models (navy) -->
  <rect x="370" y="160" width="240" height="500" fill="#ffffff" stroke="#1a2754" stroke-width="2" rx="6"/>
  <rect x="370" y="160" width="240" height="36" fill="#1a2754" rx="6"/>
  <rect x="370" y="190" width="240" height="6" fill="#1a2754"/>
  <text x="490" y="184" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">CLOUD + EDGE</text>

  <g font-size="13" fill="#1e293b">
    <rect x="390" y="220" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="490" y="244" font-weight="700" text-anchor="middle">CNN Anomaly Models</text>
    <text x="490" y="264" text-anchor="middle">ResNet50 · EfficientNet</text>
    <text x="490" y="280" font-size="11" fill="#64748b" text-anchor="middle">PatchCore for defect zoning</text>

    <rect x="390" y="305" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="490" y="329" font-weight="700" text-anchor="middle">AWS SageMaker</text>
    <text x="490" y="349" text-anchor="middle">or Azure Custom Vision</text>
    <text x="490" y="365" font-size="11" fill="#64748b" text-anchor="middle">Training + retraining pipeline</text>

    <rect x="390" y="390" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="490" y="414" font-weight="700" text-anchor="middle">Golden-Sample DB</text>
    <text x="490" y="434" text-anchor="middle">Reference quality bank</text>
    <text x="490" y="450" font-size="11" fill="#64748b" text-anchor="middle">Per model · per shift · per color</text>

    <rect x="390" y="475" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="490" y="499" font-weight="700" text-anchor="middle">MLflow Registry</text>
    <text x="490" y="519" text-anchor="middle">Model versioning</text>
    <text x="490" y="535" font-size="11" fill="#64748b" text-anchor="middle">Drift monitor · auto-retrain</text>

    <rect x="390" y="560" width="200" height="80" fill="#0d8a72" rx="4"/>
    <text x="490" y="588" font-weight="700" fill="#ffffff" text-anchor="middle">Closed-Loop Learning</text>
    <text x="490" y="608" fill="#d1fae5" font-size="11" text-anchor="middle">Rework data → labeled set</text>
    <text x="490" y="624" fill="#d1fae5" font-size="11" text-anchor="middle">Weekly retraining cadence</text>
  </g>

  <!-- Layer 3: Integration (orange) -->
  <rect x="700" y="160" width="240" height="500" fill="#ffffff" stroke="#d97706" stroke-width="2" rx="6"/>
  <rect x="700" y="160" width="240" height="36" fill="#d97706" rx="6"/>
  <rect x="700" y="190" width="240" height="6" fill="#d97706"/>
  <text x="820" y="184" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PLANT SYSTEMS</text>

  <g font-size="13" fill="#1e293b">
    <rect x="720" y="220" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="820" y="244" font-weight="700" text-anchor="middle">SAP MES Connector</text>
    <text x="820" y="264" text-anchor="middle">Line-hold signal-out</text>
    <text x="820" y="280" font-size="11" fill="#64748b" text-anchor="middle">Pre-built by PeopleTech</text>

    <rect x="720" y="305" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="820" y="329" font-weight="700" text-anchor="middle">OPC-UA Bus</text>
    <text x="820" y="349" text-anchor="middle">Line controller traffic</text>
    <text x="820" y="365" font-size="11" fill="#64748b" text-anchor="middle">Read station + variant context</text>

    <rect x="720" y="390" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="820" y="414" font-weight="700" text-anchor="middle">Defect Database</text>
    <text x="820" y="434" text-anchor="middle">PostgreSQL · time-series</text>
    <text x="820" y="450" font-size="11" fill="#64748b" text-anchor="middle">Linked to VIN + operator + shift</text>

    <rect x="720" y="475" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="820" y="499" font-weight="700" text-anchor="middle">Kafka Event Stream</text>
    <text x="820" y="519" text-anchor="middle">Defect events out</text>
    <text x="820" y="535" font-size="11" fill="#64748b" text-anchor="middle">Feeds analytics + downstream</text>

    <rect x="720" y="560" width="200" height="80" fill="#b45309" rx="4"/>
    <text x="820" y="588" font-weight="700" fill="#ffffff" text-anchor="middle">No Rip-and-Replace</text>
    <text x="820" y="608" fill="#fef3c7" font-size="11" text-anchor="middle">Uses Hyundai's existing</text>
    <text x="820" y="624" fill="#fef3c7" font-size="11" text-anchor="middle">SAP MES / MES vendor</text>
  </g>

  <!-- Layer 4: UX / Decision (purple) -->
  <rect x="1060" y="160" width="240" height="500" fill="#ffffff" stroke="#7c3aed" stroke-width="2" rx="6"/>
  <rect x="1060" y="160" width="240" height="36" fill="#7c3aed" rx="6"/>
  <rect x="1060" y="190" width="240" height="6" fill="#7c3aed"/>
  <text x="1180" y="184" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PEOPLE</text>

  <g font-size="13" fill="#1e293b">
    <rect x="1080" y="220" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="1180" y="244" font-weight="700" text-anchor="middle">Quality Dashboard</text>
    <text x="1180" y="264" text-anchor="middle">Real-time defect feed</text>
    <text x="1180" y="280" font-size="11" fill="#64748b" text-anchor="middle">Trend · heat-map · drill-down</text>

    <rect x="1080" y="305" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="1180" y="329" font-weight="700" text-anchor="middle">Operator Hold UI</text>
    <text x="1180" y="349" text-anchor="middle">Station tablet</text>
    <text x="1180" y="365" font-size="11" fill="#64748b" text-anchor="middle">Image + defect zone overlay</text>

    <rect x="1080" y="390" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="1180" y="414" font-weight="700" text-anchor="middle">Supervisor Alerts</text>
    <text x="1180" y="434" text-anchor="middle">Slack / Teams / Email</text>
    <text x="1180" y="450" font-size="11" fill="#64748b" text-anchor="middle">SLA-tiered escalation</text>

    <rect x="1080" y="475" width="200" height="68" fill="#f1f5f9" rx="4"/>
    <text x="1180" y="499" font-weight="700" text-anchor="middle">Engineering Portal</text>
    <text x="1180" y="519" text-anchor="middle">Root-cause analysis</text>
    <text x="1180" y="535" font-size="11" fill="#64748b" text-anchor="middle">Defect → station → fixture link</text>

    <rect x="1080" y="560" width="200" height="80" fill="#6d28d9" rx="4"/>
    <text x="1180" y="588" font-weight="700" fill="#ffffff" text-anchor="middle">12-Week Pilot KPIs</text>
    <text x="1180" y="608" fill="#ede9fe" font-size="11" text-anchor="middle">≥30% ↓ escape defects</text>
    <text x="1180" y="624" fill="#ede9fe" font-size="11" text-anchor="middle">&lt;2s detection latency</text>
  </g>

  <!-- Flow arrows between layers -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="285" y1="400" x2="365" y2="400"/>
    <line x1="615" y1="400" x2="695" y2="400"/>
    <line x1="945" y1="400" x2="1055" y2="400"/>
  </g>

  <!-- Closed-loop feedback arrow (rework → retraining) -->
  <g stroke="#0d8a72" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <path d="M 1180,700 Q 700,760 490,700" marker-end="url(#arrow-teal)"/>
  </g>
  <text x="800" y="755" font-size="11" fill="#0d8a72" font-style="italic" text-anchor="middle">Closed-loop retraining from operator-reviewed defects</text>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d8a72"/>
    </marker>
  </defs>

  <!-- Footer -->
  <rect x="0" y="780" width="1400" height="40" fill="#0f1729"/>
  <text x="40" y="805" font-size="11" fill="#cbd5e1" font-weight="600">PeopleTech · AI Manufacturing Practice</text>
  <text x="1360" y="805" font-size="11" fill="#94a3b8" text-anchor="end" letter-spacing="1">PILOT 1 ARCHITECTURE · CONFIDENTIAL</text>
</svg>
